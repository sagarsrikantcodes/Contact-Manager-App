<body>
  <header>
    <h1>Contact Manager App</h1>
  </header>
  <main>
    <div id="container1">
      <button type="text"><a href="/createContact.html" id="create_contact_link">Add Contact</a></button>
      <input type="text" placeholder="Search" id="search_input">
    </div>
    <div id="container2">
      <table id="contactsList">
        <thead>
          <tr class="header">
            <th style="width: 20%">Full Name</th>
            <th style="width: 20%">Email Address</th>
            <th style="width: 20%">Telephone Number</th>
            <th style="width: 20%">Tags
              <select name="tags" id="tags" multiple>
                <option value="all" selected>All</option>
                <option value="work">Work</option>
                <option value="business">Business</option>
                <option value="engineering">Engineering</option>
                <option value="marketing">Marketing</option>
                <option value="medical">Medical</option>
                <option value="lawyer">Lawyer</option>
                <option value="friend">Friend</option>
                <option value="null">None</option>
              </select>
            </th>
            <th style="width: 20%">Modify List</th>
          </tr>
        </thead>
        <tbody>

        </tbody>
      </table>
    </div>
  </main>
  <script id="contactTemplate" type="text/x-handlebars">
    <tr>
      <td>{{full_name}}</td>
      <td>{{email}}</td>
      <td>{{phone_number}}</td>
      <td>{{tags}}</td>
      <td>
        <div>
          <button type="text" class="edit_button" data-id="{{id}}">
            <i class="fa fa-edit"></i>
            Edit
          </button>
        </div>
        <div>
          <button type="text" class="delete_button" data-id="{{id}}">
            <i class="fa fa-trash-o"></i>
            Delete
          </button>
        </div>
      </td>
    </tr>
  </script>
  <script id="contactsTemplate" type="text/x-handlebars">
    {{#each contacts}}
    {{> contactTemplate}}
    {{/each}}
  </script>
  <script src="/javascripts/contacts.js"></script>
  <script type="module" src="/javascripts/autocomplete.js"></script>
</body>
